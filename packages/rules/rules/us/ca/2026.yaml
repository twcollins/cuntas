# California personal income tax. 2026 inflation-adjusted figures come out in late December, so
# these are 2025's (2025 Form 540 booklet and rate schedules). The top band includes the 1%
# Behavioral Health Services Tax on taxable income over $1 million (not doubled for joint returns).
# Exemptions are credits: $153 per filer and per filer 65+, $475 per dependent, each cut by $6 per
# $2,500 of AGI over the threshold.
