# Indiana individual income tax, 2026: a flat 2.95% on federal AGI less exemptions and deductions,
# plus the county income tax of the county you lived in on January 1, on the same income. The state
# rate is 2026's; county rates are those in effect January 1, 2026 (Departmental Notice #1, R46).
# Exemptions and deductions follow the 2025 IT-40 (the 2026 booklet isn't published yet).
kind: usState
state: IN
parent: US
taxYear: "2026"
version: "US-IN-2026.2"
status: provisional
effective: { from: "2026-01-01", to: "2026-12-31" }
sources:
  - https://www.in.gov/dor/resources/tax-rates-and-reports/rates-fees-and-penalties/
  - https://web.archive.org/web/20260116121024/https://www.in.gov/dor/files/dn01.pdf
  - https://forms.in.gov/Download.aspx?id=16915
# $1,000 for each filer and dependent; a dependent child adds $1,500 (2,500 in all); $1,000 for each
# filer 65 or over, and $500 more each if AGI is under $40,000 ($20,000 married filing separately).
incomeTax:
  source: https://forms.in.gov/Download.aspx?id=16915
  base: federalAgi
  rate: 0.0295
  exemption:
    perFiler: 1000
    perDependent: 2500
    perAged: 1000
    agedLowIncome: { extra: 500, below: { single: 40000, marriedJoint: 40000, marriedSeparate: 20000, headOfHousehold: 40000 } }
  # Rent on your Indiana main home, up to $3,000 ($1,500 married filing separately).
  rentDeduction: { share: 1, max: { single: 3000, marriedJoint: 3000, marriedSeparate: 1500, headOfHousehold: 3000 } }
  notes:
    - "Indiana's refundable earned income credit (10% of the federal one) isn't included."
    - "The homeowner's property tax deduction (up to $2,500), the 2026 tips, overtime and car loan interest deductions, and the extra exemptions for a first or adopted child aren't included."
localTax:
  source: https://web.archive.org/web/20260116121024/https://www.in.gov/dor/files/dn01.pdf
  note: "Every Indiana county levies a county income tax, set by where you lived on January 1."
# Boone's rate rose to 0.0171 for withholding from October 1, 2026; its annual 2026 rate isn't
# published yet (a past change was blended over the year).
