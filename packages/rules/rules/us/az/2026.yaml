# Arizona individual income tax, 2026: a flat 2.5% on federal AGI less the standard deduction, with
# $2,100 more for each filer 65 or over and a $125 credit per dependent under 17. The standard
# deduction follows the federal one (A.R.S. 43-1041). The rate comes from a legislative summary; the
# Department of Revenue's pages couldn't be read and a surplus-triggered cut was proposed: check.
kind: usState
