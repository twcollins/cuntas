# Montana individual income tax, 2026 (HB 337): two rates on federal taxable income, so the federal
# standard deduction is already taken. Filers 65+ subtract $5,660 each (2025's amount).
kind: usState
state: MT
parent: US
taxYear: "2026"
version: "US-MT-2026.1"
status: provisional
effective: { from: "2026-01-01", to: "2026-12-31" }
sources:
  - https://revenue.mt.gov/news/recent-news/HB-337
  - https://revenuefiles.mt.gov/files/Forms/Montana_Employer_and_Information_Agent_Guide_with_Tax_Tables.pdf
incomeTax:
  source: https://revenue.mt.gov/news/recent-news/HB-337
  base: federalTaxableIncome
  brackets:
    single: [{ upTo: 47500, rate: 0.047 }, { upTo: null, rate: 0.0565 }]
    marriedJoint: [{ upTo: 95000, rate: 0.047 }, { upTo: null, rate: 0.0565 }]
    marriedSeparate: [{ upTo: 47500, rate: 0.047 }, { upTo: null, rate: 0.0565 }]
    headOfHousehold: [{ upTo: 71250, rate: 0.047 }, { upTo: null, rate: 0.0565 }]
  ageDeduction:
    perPerson: 5660
    age: 65
    phaseOutFrom: { single: 0, marriedJoint: 0, marriedSeparate: 0, headOfHousehold: 0 }
    phaseOutRate: 0
  notes:
    - "Montana's earned income credit (20% of the federal one) and elderly homeowner/renter credit aren't included."
