# England, Wales and Northern Ireland. Seed data from docs/SPEC.md; verify against HMRC.
jurisdiction: UK
taxYear: "2026-27"
version: "UK-2026-27.1"
status: verified
currency: GBP
effective: { from: "2026-04-06", to: "2027-04-05" }
sources:
  - https://taxscape.deloitte.com/taxtables/deloitte-uk-tax-rates-2026-27.pdf

incomeTax:
  source: https://quickbooks.intuit.com/uk/blog/new-tax-year-changes-2026-2027/
  personalAllowance: 12570
  taper: { above: 100000, divisor: 2 }
  # Bands are measured on taxable income (after the personal allowance), as HMRC publishes them:
  # basic rate to GBP 50,270 of total income = 37,700 of taxable income; additional rate above 125,140.
  bands:
    - { upTo: 37700, rate: 0.20 }
    - { upTo: 125140, rate: 0.40 }
    - { upTo: null, rate: 0.45 }

nationalInsurance:
  source: https://uktaxdrag.co.uk/rates-and-allowances-2026-27
  primaryThreshold: 12570
  upperEarningsLimit: 50270
  mainRate: 0.08
  upperRate: 0.02

isa:
  source: https://www.nsandi.com/get-to-know-us/isa-allowances
  annualAllowance: 20000
  lifetimeIsaLimit: 4000
  juniorIsaLimit: 9000

savings:
  source: https://www.taxassist.co.uk/resources/questions-and-answers/tax-on-bank-interest
  rates: { basic: 0.20, higher: 0.40, additional: 0.45 }
  personalSavingsAllowance: { basic: 1000, higher: 500, additional: 0 }

dividends:
  source: https://www.att.org.uk/technical/news/202627-tax-year-updates-housekeeping-individuals
  allowance: 500
  rates: { basic: 0.1075, higher: 0.3575, additional: 0.3935 }

statePension:
  source: https://www.aviva.co.uk/investments/investing-for-beginners/autumn-budget-update/
  fullWeekly: 241.30
  qualifyingYearsForFull: 35
  minimumQualifyingYears: 10

niVoluntary:
  source: https://www.crowe.com/uk/insights/changes-voluntary-national-insurance-abroad
  class2AbroadAbolishedFrom: "2026-04-06"
  class3AnnualCost: 923
  abroadMinimumYearsUkLink: 10

deadlines:
  source: https://www.gov.uk/self-assessment-tax-returns/deadlines
  selfAssessmentOnline: { monthDay: "01-31", yearOffset: 1 }
