# Legislated April 2027 changes. Provisional: the Autumn Budget (28 Oct 2026) may change this pack.
jurisdiction: UK
taxYear: "2027-28"
version: "UK-2027-28.1"
status: provisional
currency: GBP
effective: { from: "2027-04-06", to: "2028-04-05" }
sources:
  - https://www.richify.ai/uk/autumn-budget-2026
  - https://uktaxdrag.co.uk/autumn-budget-2026-tracker

incomeTax:
  source: https://taxscape.deloitte.com/taxtables/deloitte-uk-tax-rates-2026-27.pdf
  personalAllowance: 12570
  taper: { above: 100000, divisor: 2 }
  # Bands are measured on taxable income (after the personal allowance), as HMRC publishes them:
  # basic rate to GBP 50,270 of total income = 37,700 of taxable income; additional rate above 125,140.
  bands:
    - { upTo: 37700, rate: 0.20 }
    - { upTo: 125140, rate: 0.40 }
    - { upTo: null, rate: 0.45 }

nationalInsurance:
  source: https://uktaxdrag.co.uk/rates-and-allowances-2026-27
  primaryThreshold: 12570
  upperEarningsLimit: 50270
  mainRate: 0.08
  upperRate: 0.02

isa:
  source: https://www.richify.ai/uk/autumn-budget-2026
  annualAllowance: 20000
  lifetimeIsaLimit: 4000
  juniorIsaLimit: 9000
  cashCap: { limit: 12000, appliesUnderAge: 65 }
  cashInStocksIsaInterestCharge: 0.22
  stocksToCashTransferBlockedUnderAge: 65

savings:
  source: https://www.taxassist.co.uk/resources/questions-and-answers/tax-on-bank-interest
  rates: { basic: 0.22, higher: 0.42, additional: 0.47 }
  personalSavingsAllowance: { basic: 1000, higher: 500, additional: 0 }

pensionsIht:
  source: https://www.richify.ai/uk/autumn-budget-2026
  unusedPensionsInEstateFrom: "2027-04-06"

deadlines:
  source: https://www.gov.uk/self-assessment-tax-returns/deadlines
  selfAssessmentOnline: { monthDay: "01-31", yearOffset: 1 }

# Plan 2 frozen from April 2027 (Autumn Budget 2025). Plans 1 and 4 rise with RPI; carried over until published.
studentLoans:
  source: https://www.gov.uk/repaying-your-student-loan/what-you-pay
  status: provisional
  plans:
    plan1: { threshold: 26900, rate: 0.09 }
    plan2: { threshold: 29385, rate: 0.09 }
    plan4: { threshold: 33795, rate: 0.09 }
    plan5: { threshold: 25000, rate: 0.09 }
    postgraduate: { threshold: 21000, rate: 0.06 }

cgt:
  source: https://www.gov.uk/capital-gains-tax/rates
  status: provisional
  annualExemptAmount: 3000
  rates: { basic: 0.18, higher: 0.24 }

pensionAnnualAllowance:
  source: https://www.gov.uk/tax-on-your-private-pension/annual-allowance
  status: provisional
  annualAllowance: 60000
  taper: { thresholdIncome: 200000, adjustedIncome: 260000, divisor: 2, minimum: 10000 }
  moneyPurchaseAnnualAllowance: 10000
  carryForwardYears: 3
  # Relief on personal contributions is capped at 100% of relevant earnings, or GBP 3,600 gross with none.
  noEarningsReliefLimit: 3600

pensionLumpSum:
  source: https://www.gov.uk/tax-on-your-private-pension/lump-sum-allowance
  status: provisional
  share: 0.25
  lumpSumAllowance: 268275
